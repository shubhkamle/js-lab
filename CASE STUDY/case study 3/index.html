<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholarship Eligibility</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #20c7c0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .card {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        color: #0f5f5b;
        font-size: 24px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #234;
      }

      input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #b8e6e3;
        border-radius: 8px;
        margin-bottom: 12px;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #1aa9a4;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #148c87;
      }

      .result {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
      }

      .result.success {
        background: #e8f8f7;
        color: #0b6b67;
      }

      .result.error {
        background: #fff1f1;
        color: #a33;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Scholarship Eligibility</h1>
      <label for="marks">Enter your marks</label>
      <input type="number" id="marks" min="0" max="100" placeholder="e.g. 88" />
      <button onclick="checkScholarship()">Check Result</button>
      <div id="result" class="result"></div>
    </div>

    <script>
      function checkScholarship() {
        const marksInput = document.getElementById("marks");
        const resultBox = document.getElementById("result");
        const marks = Number(marksInput.value);

        if (!marksInput.value.trim() || marks < 0 || marks > 100) {
          resultBox.className = "result error";
          resultBox.textContent = "Please enter valid marks between 0 and 100.";
          return;
        }

        let scholarshipLevel;
        let message;

        if (marks < 50) {
          scholarshipLevel = "Not Eligible";
          message = "You are not eligible for a scholarship.";
        } else if (marks <= 69) {
          scholarshipLevel = "Bronze";
          message = "You qualify for the Bronze scholarship.";
        } else if (marks <= 84) {
          scholarshipLevel = "Silver";
          message = "You qualify for the Silver scholarship.";
        } else if (marks <= 94) {
          scholarshipLevel = "Gold";
          message = "You qualify for the Gold scholarship.";
        } else {
          scholarshipLevel = "Platinum";
          message = "You qualify for the Platinum scholarship.";
        }

        resultBox.className = "result success";
        resultBox.innerHTML = `<div>${message}</div><div style="margin-top:8px;">Scholarship Level: ${scholarshipLevel}</div>`;
      }
    </script>
  </body>
</html>
