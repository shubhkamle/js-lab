<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Billing Calculator</h1>
    <div class="card">
      <label>
        Item name
        <input id="itemName" type="text" placeholder="e.g. Widget" value="Widget" />
      </label>
      <label>
        Unit price ($)
        <input id="price" type="number" min="0" step="0.01" value="12.50" />
      </label>
      <label>
        Quantity
        <input id="quantity" type="number" min="1" step="1" value="3" />
      </label>
      <label>
        Discount (%)
        <input id="discount" type="number" min="0" max="100" step="1" value="10" />
      </label>
      <label>
        Tax (%)
        <input id="tax" type="number" min="0" max="100" step="1" value="8" />
      </label>
      <button id="calculateBtn">Calculate</button>
    </div>
    <div id="output" class="output">
      <p>Enter values and click calculate.</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
